  <text x="90" y="148" font-size="12" fill="#8b1e2d">10-K, Item 1A, p. 14</text>
  <text x="80" y="184" font-size="14" fill="#211b1c">Sales are concentrated in one region.</text>
  <rect x="80" y="194" width="118" height="22" rx="6" fill="#8b1e2d" fill-opacity=".1"/>
  <text x="90" y="210" font-size="12" fill="#8b1e2d">10-K, Item 1A, p. 15</text>
