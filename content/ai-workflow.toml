type = "guide"
title = "How I work with AI"
description = "Claude Code is my main tool for research and for building software. These are the habits that have saved me the most time, written so you can try them yourself."

[[links]]
label = "Templates on GitHub"
href = "https://github.com/jackyyangjq/ai-research-workflow"

# In each section, plain keys must come before any [[sections.x]] header,
# or TOML files them under the wrong table.
# Icons: messages, eye, target, key, clipboard, bot, shield, board.

[[sections]]
id = "questions-first"
nav = "Questions first"
title = "Let it ask the questions first"
lead = "Most of the time I lose with an AI agent comes from letting it start too early. Before any code or text is written, have it interview you, then choose from a short list of options."
examples_title = "Small tools I built this way"

[[sections.tiles]]
icon = "messages"
title = "Ask to be interviewed"
body = "Start with: “Don't write anything yet. First ask me the questions you need answered.” Your answers become the spec."

[[sections.tiles]]
icon = "clipboard"
title = "Pick from a list"
body = "Ask for three ways to do it and what each one costs. Choosing from a list is quicker than correcting a draft you never wanted."

[[sections.tiles]]
icon = "eye"
title = "Look at the result"
body = "After each change, run the app or open the table. Code that reads well can still give the wrong answer."

