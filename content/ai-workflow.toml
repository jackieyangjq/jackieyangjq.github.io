[[sections]]
id = "commands"
nav = "Four commands"
title = "Four commands worth learning"
lead = "Beyond ordinary chat, these are the commands I use most. All four work in the terminal, and /btw, /doctor and /effort also work in the desktop app. Click one to see how to use it."
fix_label = "Use it when"

[[sections.folds]]
title = "/btw"
fix = "you want to ask something quick while Claude is still working."
body = "Type /btw and your question. It can see the conversation so far, answers in a small window, and the main task keeps running. The question is not added to the conversation, so it does not affect the main task. It cannot open files or run commands, so ask about what has already happened, for example “which file did you just change, and why?” In the desktop app it is called side chat, and on a Mac you open it with Cmd+;."

[[sections.folds]]
title = "/doctor"
fix = "Claude starts ignoring one of your rules, or you have installed many plugins and skills."
body = "It checks your installation, unused extensions and your rules files, and reports before changing anything. Newer versions add /doctor prompt-audit, which looks for instructions that contradict each other or are out of date. The first time I ran it, it found 17 problems, several of them pairs of rules that contradicted each other. Read the report, decide which of the conflicting rules to keep, and only then let it make the changes."

[[sections.folds]]
title = "/effort"
fix = "the work moves from planning to checking."
body = "It sets how hard the model thinks before it answers. My rule is low effort while deciding what to do, and high effort when the result has to be right, such as debugging an estimate that looks wrong or reviewing code that handles passwords and keys. If the plan itself is wrong, more effort will not save it, so go back to the questions."

[[sections.folds]]
title = "/rewind"
fix = "Claude has gone in the wrong direction and you want to go back."
body = "With the prompt box empty, press Esc twice, or type /rewind, and choose an earlier message. You can restore the code, the conversation, or both. It does not undo changes to files that only shell commands touched, so keep using Git for anything that matters."

[[sections]]
id = "sessions"
nav = "One paper, many sessions"
title = "One paper, many sessions"
lead = "A paper takes months, which is far too long for one chat. I organise it the way a small team would: one session plans, other sessions do the work, and a fresh one checks it. Progress is kept in files, so nothing is lost when a session ends."
steps_style = "flow"
callout = "Do not start too many sessions at once. When parallel work exhausted my usage quota, I asked the planning session for the prompts and the order to run them, ran them myself, and had it check the results at the end."

[[sections.steps]]
icon = "clipboard"
label = "Planning session"
title = "Plan"
body = "Splits the work into task cards. Each card states the goal and how we will know it is done."

[[sections.steps]]
icon = "bot"
label = "Worker sessions"
title = "Do"
body = "One card per session. The strongest model handles judgement calls and a cheaper one handles routine work."

[[sections.steps]]
icon = "shield"
label = "Fresh session"
title = "Check"
body = "A new session checks the result against the card. The session that did the work should not be the only one to check it."

[[sections.steps]]
icon = "board"
label = "Task board"
title = "Record"
body = "One file lists every card and its status. Each new session reads it before starting."

[[sections]]
id = "quiet-errors"
nav = "Silent errors"
title = "Errors that give no warning"
lead = "The worst mistakes I have made with AI produced no error message, only a number or a file that looked fine. Here is what each one looked like and how to catch it."
fix_label = "Check"

[[sections.folds]]
title = "A log that said it worked"
fix = "open the output and look at it, whatever the log says."
body = "A script that turned my manuscript into a Word file skipped the formatting rules it could not match and still reported success. The headings came out in the wrong font."

[[sections.folds]]
title = "A sign stored the other way round"
fix = "compare units and signs with the data documentation."
body = "Capital spending was stored as negative numbers, as is usual in cash-flow statements. Used without correcting the sign, it turned one of my conclusions the wrong way round."

[[sections.folds]]
title = "Groups merged without warning"
fix = "count unique IDs before and after every merge."
body = "An ID built from two other columns was not unique, so groups that should have stayed separate were combined. Nothing failed, but the results changed."

[[sections.folds]]
title = "A helper that kept running"
fix = "give agents narrow folder paths, and look for leftover processes after long jobs."
body = "A file search started by an AI helper kept running after its task had ended. It used the processor for hours and made the cloud-sync service download every file it touched."

[[sections]]
id = "ground-rules"
nav = "Ground rules"
title = "Ground rules"
lead = "However fast AI makes drafting, these are the checks I never skip."

[[sections.cards]]
title = "In research"
points = [
  "The research question, the design and every claim in print are my responsibility.",
  "Check every reference against its DOI before citing it. Models produce convincing references that do not exist.",
  "Declare AI use as each journal requires.",
]

[[sections.cards]]
title = "In code"
points = [
  "Public code runs on simulated or public data. Confidential data stays out of public repositories.",
  "Keep API keys out of Git, and read through every repository before making it public.",
  "When an LLM labels text for measurement, have a second model check the labels.",
]
