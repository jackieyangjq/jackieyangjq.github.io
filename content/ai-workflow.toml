[[sections]]
id = "questions-first"
nav = "Questions first"
title = "Let it ask the questions first"
lead = "Most of the time I lose with an AI agent comes from letting it start too early. Before any code or text is written, have it interview you, then choose from a short list of options."
examples_title = "Small tools I built this way"
demo = "interview"
illustration = "/images/ai-workflow/doodle-reading.svg"

[[sections.tiles]]
picto = "carbon-question--and--answer"
title = "Ask to be interviewed"
body = "Start with: “Don't write anything yet. First ask me the questions you need answered.” Save the answers in a spec file, then build in a new session."

[[sections.tiles]]
picto = "carbon-list--checkbox"
title = "Pick from a list"
body = "Ask for three ways to do it and what each one costs. Choosing from a list is quicker than correcting a draft."

[[sections.tiles]]
picto = "carbon-visual--inspection"
title = "Look at the result"
body = "After each change, run the app or open the table, because code that reads well can still give a wrong answer."

