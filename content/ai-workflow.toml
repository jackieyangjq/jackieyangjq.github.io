[[sections]]
id = "quiet-errors"
nav = "Silent errors"
title = "Errors that give no warning"
lead = "The worst mistakes I have made with AI produced no error message, only a number or a file that looked fine. Here is what each one looked like and how to catch it."
fix_label = "What to do"
demo = "errors"
illustration = "/images/ai-workflow/doodle-clumsy.svg"
gallery_title = "The same problem in published examples"

[[sections.folds]]
title = "A log that said it worked"
demo = "log"
fix = "open the output and look at it, whatever the log says."
body = "A script that turned my manuscript into a Word file skipped the formatting rules it could not match and still reported success. The headings appeared in the wrong font."

[[sections.folds]]
title = "A sign stored the other way round"
demo = "sign"
fix = "compare units and signs with the data documentation."
body = "Capital spending was stored as negative numbers, as is usual in cash-flow statements. Used without correcting the sign, it reversed one of my conclusions."

[[sections.folds]]
title = "Groups merged without warning"
demo = "merge"
fix = "count unique IDs before and after every merge."
body = "An ID built from two other columns was not unique, so groups that should have stayed separate were combined. Nothing failed, but the results changed."

[[sections.folds]]
title = "A helper that kept running"
demo = "process"
fix = "give agents narrow folder paths, and look for leftover processes after long jobs."
body = "A file search started by an AI helper continued to run after its task had ended. It used the processor for hours and made the cloud-sync service download every file it touched."

