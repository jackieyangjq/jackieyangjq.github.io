[[sections]]
id = "commands"
nav = "Four commands"
title = "Four commands worth learning"
lead = "Beyond ordinary chat, these are the commands I use most. All four work in the terminal, and /btw, /doctor and /effort also work in the desktop app. Choose one to watch it run."
fix_label = "Use it when"
demo = "commands"

[[sections.folds]]
title = "/btw"
demo = "btw"
fix = "you want to ask something quick while Claude is still working."
body = "Type /btw and your question. It can see the conversation so far and answers in a small window while the main task continues. The question is not added to the conversation. It answers from what it already knows, so ask about what has already happened, for example “which file did you just change, and why?” If the answer needs a search, press f to hand it to a background agent. In the desktop app it is called side chat, and on a Mac you open it with Cmd+;."
caution = "If a permission prompt appears while the window is open, look before you press a key. Esc can reject the edit."
more_label = "Anthropic's documentation on side questions"
more_href = "https://code.claude.com/docs/en/interactive-mode#side-questions-with-%2Fbtw"

[[sections.folds]]
title = "/doctor"
demo = "doctor"
caution = "Its first suggestion may be to fix everything at once. Review the items one at a time."
more_label = "Anthropic's list of commands"
more_href = "https://code.claude.com/docs/en/commands"
fix = "Claude starts ignoring one of your rules, or you have installed many plugins and skills."
body = "It checks your installation, unused extensions and your rules files, and reports before changing anything. Newer versions add /doctor prompt-audit, which looks for instructions that contradict each other or are out of date. The first time I ran it, it found 17 problems, several of them pairs of rules that contradicted each other. Read the report, decide which of the conflicting rules to keep, and only then let it make the changes."

[[sections.folds]]
title = "/effort"
demo = "effort"
caution = "Max lasts only for the current session, and the app warns that it can overthink. Keep it for the hardest tasks."
more_label = "Anthropic: Spending your effort"
more_href = "https://claude.dev/blog/spending-your-effort/"
fix = "the work moves from planning to checking."
body = "It sets how much work the model does before it answers, including how much it reads and checks. My rule is low effort while deciding what to do, and high effort or above when the result has to be right, such as tracing why two runs of a model disagree or reviewing code that handles passwords and keys. If the plan is wrong, more effort will not correct it, so return to the questions."

[[sections.folds]]
title = "/rewind"
demo = "rewind"
caution = "Most edits made by subagents are not restored either, so commit before you split work across agents."
more_label = "Anthropic: Session management and 1M context"
more_href = "https://claude.com/blog/using-claude-code-session-management-and-1m-context"
fix = "Claude has taken the wrong direction and you want to return to an earlier point."
body = "With the prompt box empty, press Esc twice, or type /rewind, and choose an earlier message. You can restore the code, the conversation, or both. Returning to an earlier point is often better than correcting, because the failed attempt is removed from the conversation. Rewinding does not undo changes to files that only shell commands touched, so keep using Git for anything that matters."

[[sections]]
id = "sessions"
nav = "One paper, many sessions"
title = "One paper, many sessions"
lead = "A paper takes months, which is too long for one chat. I organise it the way a small team would: one session plans, other sessions do the work, and a fresh one checks it. Progress is kept in files, so nothing is lost when a session ends."
demo = "sessions"
illustration = "/images/ai-workflow/peeps-team.svg"
gallery_title = "How others draw the same idea"
callout = "Do not start too many sessions at once. When parallel work exhausted my usage quota, I asked the planning session for the prompts and the order to run them, ran them myself, and had it check the results at the end."

